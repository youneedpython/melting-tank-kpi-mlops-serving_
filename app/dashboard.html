<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Melting Tank KPI Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:28px}main{max-width:1100px;margin:auto}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,#chart{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px #18233a12}
    .label{font-size:13px;color:#657089}.value{font-size:25px;font-weight:700;margin-top:7px}.alert{color:#b42318}.ok{color:#067647}#chart{margin-top:18px;height:430px}
    @media(max-width:750px){.cards{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main>
  <h1>용해탱크 다음 1분 NG 예측</h1>
  <p>최근 API 예측과 모델 배포 상태를 확인합니다.</p>
  <section class="cards">
    <div class="card"><div class="label">서빙 상태</div><div id="ready" class="value">-</div></div>
    <div class="card"><div class="label">최근 요청</div><div id="requests" class="value">0</div></div>
    <div class="card"><div class="label">NG 예측</div><div id="ng" class="value">0</div></div>
    <div class="card"><div class="label">평균 지연시간</div><div id="latency" class="value">0 ms</div></div>
  </section>
  <div id="chart"></div>
</main><script>
async function refresh(){
  const response=await fetch('/dashboard/data?limit=100'); const data=await response.json();
  const ready=data.status.status==='ready'; const readyEl=document.getElementById('ready');
  readyEl.textContent=ready?'READY':'BLOCKED'; readyEl.className='value '+(ready?'ok':'alert');
  document.getElementById('requests').textContent=data.summary.requests;
  document.getElementById('ng').textContent=data.summary.ng_count;
  document.getElementById('latency').textContent=data.summary.avg_latency_ms.toFixed(1)+' ms';
  const rows=data.predictions;
  Plotly.react('chart',[{x:rows.map(r=>r.created_at),y:rows.map(r=>r.probability_ng),mode:'lines+markers',name:'NG 확률'},
    {x:rows.map(r=>r.created_at),y:rows.map(r=>r.threshold),mode:'lines',name:'임계값',line:{dash:'dash'}}],
    {title:'최근 NG 확률',yaxis:{range:[0,1],title:'Probability'},xaxis:{title:'Time'},margin:{t:55}});
}
refresh(); setInterval(refresh,10000);
</script></body></html>
