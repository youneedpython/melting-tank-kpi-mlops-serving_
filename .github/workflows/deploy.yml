name: Deploy to AWS ECS

on:
  workflow_dispatch:

  push:
    tags:
      - "v4.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------------
      # 1. 소스 코드 체크아웃
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python 환경 구성
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # -----------------------------------------------------------------------
      # 3. 테스트 및 정적 분석 도구 설치
      # -----------------------------------------------------------------------
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # -----------------------------------------------------------------------
      # 4. 배포 전 코드 품질 및 테스트 검증
      # -----------------------------------------------------------------------
      - name: Verify source before deployment
        run: |
          python -m ruff check .
          python -m pytest

      # -----------------------------------------------------------------------
      # 5. GitHub OIDC를 이용한 임시 AWS 자격 증명 발급
      # -----------------------------------------------------------------------
      - name: Configure temporary AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions-ECS-Deploy

      # -----------------------------------------------------------------------
      # 6. AWS 호출 정보 확인
      #
      # Access Key나 Secret Key를 출력하지 않고,
      # 현재 맡은 IAM 역할과 AWS 계정만 확인합니다.
      # -----------------------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -----------------------------------------------------------------------
      # 7. Amazon ECR 로그인
      # -----------------------------------------------------------------------
      - name: Sign in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # 8. Docker 이미지 빌드 및 ECR Push
      #
      # Git commit SHA를 이미지 태그로 사용합니다.
      # 동일한 commit의 이미지가 이미 존재하면 다시 만들지 않고 재사용합니다.
      # -----------------------------------------------------------------------
      - name: Build and push immutable image
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "ECR repository: ${ECR_REPOSITORY}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Image URI: ${image_uri}"

          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            >/dev/null 2>&1; then

            echo "The immutable image already exists."
            echo "Reusing image: ${image_uri}"
          else
            echo "Building image: ${image_uri}"

            docker build \
              --tag "${image_uri}" \
              .

            echo "Pushing image: ${image_uri}"

            docker push "${image_uri}"
          fi

          echo "uri=${image_uri}" >> "${GITHUB_OUTPUT}"

      # -----------------------------------------------------------------------
      # 9. 현재 ECS Task Definition 다운로드
      # -----------------------------------------------------------------------
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION }}" \
            --query taskDefinition \
            > task-definition.json

      # -----------------------------------------------------------------------
      # 10. Task Definition의 컨테이너 이미지 교체
      # -----------------------------------------------------------------------
      - name: Insert the new image into the task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      # -----------------------------------------------------------------------
      # 11. ECS 서비스에 새로운 Task Definition 배포
      # -----------------------------------------------------------------------
      - name: Deploy the new task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      # -----------------------------------------------------------------------
      # 12. 애플리케이션 상태 확인
      #
      # /healthz
      #   - FastAPI 애플리케이션이 정상 실행 중이면 200
      #   - 반드시 성공해야 함
      #
      # /readyz
      #   - 승인 모델이 준비되면 200
      #   - 승인 모델이 아직 없으면 503
      #
      # 현재 bootstrap 배포에서는 503도 정상 상태로 인정합니다.
      # -----------------------------------------------------------------------
      - name: Check health and model readiness
        shell: bash
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail

          base_url="${APP_BASE_URL%/}"

          echo "===== Application health check ====="
          echo "Health URL: ${base_url}/healthz"

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "${base_url}/healthz"

          echo
          echo "Application health check passed."

          echo
          echo "===== Model readiness check ====="
          echo "Readiness URL: ${base_url}/readyz"

          ready_status="$(
            curl \
              --silent \
              --show-error \
              --output ready-response.json \
              --write-out "%{http_code}" \
              "${base_url}/readyz"
          )"

          echo "Readiness response:"
          cat ready-response.json

          echo
          echo "Readiness HTTP status: ${ready_status}"

          if [ "${ready_status}" = "200" ]; then
            echo "Approved model is loaded and ready."
            echo "Deployment and model readiness checks passed."

          elif [ "${ready_status}" = "503" ]; then
            echo "Application deployment succeeded."
            echo "No approved model is ready yet."
            echo "HTTP 503 is allowed during the bootstrap deployment."

          else
            echo "Unexpected readiness HTTP status: ${ready_status}"
            echo "Expected status: 200 or 503"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 13. 배포 결과 요약
      # -----------------------------------------------------------------------
      - name: Write deployment summary
        if: success()
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          {
            echo "## AWS ECS deployment result"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| AWS Region | \`${{ vars.AWS_REGION }}\` |"
            echo "| ECS Cluster | \`${{ vars.ECS_CLUSTER }}\` |"
            echo "| ECS Service | \`${{ vars.ECS_SERVICE }}\` |"
            echo "| Task Definition | \`${{ vars.ECS_TASK_DEFINITION }}\` |"
            echo "| Container | \`${{ vars.ECS_CONTAINER_NAME }}\` |"
            echo "| Image | \`${IMAGE_URI}\` |"
            echo "| Application URL | ${APP_BASE_URL} |"
            echo
            echo "> A readiness response of HTTP 503 is allowed during the bootstrap deployment when no approved model exists."
          } >> "${GITHUB_STEP_SUMMARY}"